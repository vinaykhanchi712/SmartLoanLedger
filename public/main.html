<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart EMI Ledger</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F7F4EC;
  --paper-line:#DCD3B8;
  --card:#FFFDF8;
  --ink:#1B2A4A;
  --ink-soft:#5A6A8A;
  --gold:#B8862F;
  --gold-soft:#EFDFB8;
  --green:#2F6B4F;
  --green-soft:#DCEAE1;
  --rust:#A63D2F;
  --rust-soft:#F2DEDA;
  --radius:2px;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  background-image:
    repeating-linear-gradient(transparent, transparent 38px, var(--paper-line) 39px);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  padding:0 0 60px 0;
}
.mono{font-family:'IBM Plex Mono', monospace;}
.wrap{max-width:920px;margin:0 auto;padding:28px 20px;}

/* Header */
.masthead{
  border-bottom:3px double var(--ink);
  padding-bottom:16px;
  margin-bottom:22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:10px;
}
.masthead h1{
  font-family:'Fraunces', serif;
  font-weight:700;
  font-size:2.1rem;
  margin:0;
  letter-spacing:-0.5px;
}
.masthead .tag{
  font-size:0.72rem;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
  font-weight:600;
}
.disclaimer{
  font-size:0.78rem;
  color:var(--ink-soft);
  background:var(--gold-soft);
  border:1px solid var(--gold);
  padding:8px 12px;
  border-radius:var(--radius);
  margin-bottom:24px;
}

/* Summary strip */
.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1px;
  background:var(--ink);
  border:1px solid var(--ink);
  margin-bottom:28px;
}
.summary .cell{
  background:var(--card);
  padding:14px 12px;
}
.summary .cell .label{
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--ink-soft);
  margin-bottom:6px;
}
.summary .cell .value{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:1.35rem;
}
@media(max-width:640px){.summary{grid-template-columns:repeat(2,1fr);}}

section{margin-bottom:34px;}
.section-head{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:1px solid var(--ink);
  padding-bottom:6px;
  margin-bottom:14px;
}
.section-head h2{
  font-family:'Fraunces', serif;
  font-size:1.15rem;
  font-weight:600;
  margin:0;
}
.section-head .idx{
  font-size:0.72rem;
  color:var(--ink-soft);
  letter-spacing:1px;
}
.btn{
  font-family:'IBM Plex Sans',sans-serif;
  font-size:0.78rem;
  font-weight:600;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:7px 14px;
  border-radius:var(--radius);
  cursor:pointer;
  letter-spacing:0.3px;
}
.btn:hover{opacity:0.85;}
.btn.secondary{background:transparent;color:var(--ink);}
.btn.danger{background:var(--rust);border-color:var(--rust);}
.btn.small{padding:4px 9px;font-size:0.7rem;}

/* Loan ledger rows */
.loan-row{
  background:var(--card);
  border:1px solid var(--paper-line);
  border-left:4px solid var(--ink);
  padding:12px 14px;
  margin-bottom:8px;
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
}
.loan-row.creditcard{border-left-color:var(--rust);}
.loan-row .num{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1rem;
  color:var(--ink-soft);
  width:22px;
}
.loan-row .main{flex:1;min-width:180px;}
.loan-row .main .name{font-weight:600;font-size:0.95rem;}
.loan-row .main .meta{font-size:0.75rem;color:var(--ink-soft);margin-top:2px;}
.loan-row .figs{display:flex;gap:18px;flex-wrap:wrap;}
.loan-row .figs .f{text-align:right;}
.loan-row .figs .f .l{font-size:0.65rem;text-transform:uppercase;color:var(--ink-soft);letter-spacing:0.5px;}
.loan-row .figs .f .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.9rem;}
.badge{
  font-size:0.65rem;
  padding:2px 7px;
  border-radius:10px;
  font-weight:600;
  letter-spacing:0.3px;
  white-space:nowrap;
}
.badge.zero{background:var(--green-soft);color:var(--green);}
.badge.charge{background:var(--rust-soft);color:var(--rust);}
.row-actions{display:flex;gap:6px;}

/* Form */
.form-panel{
  background:var(--card);
  border:1px solid var(--ink);
  padding:18px;
  margin-bottom:16px;
}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field label{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.5px;color:var(--ink-soft);margin-bottom:4px;}
.field input,.field select{
  width:100%;
  padding:8px 9px;
  border:1px solid var(--paper-line);
  background:var(--paper);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:0.88rem;
  border-radius:var(--radius);
  color:var(--ink);
}
.field input:focus,.field select:focus{outline:2px solid var(--gold);border-color:var(--gold);}
.field.check{display:flex;align-items:center;gap:8px;}
.field.check input{width:auto;}
.form-actions{display:flex;gap:8px;margin-top:14px;}

/* Priority stamps */
.priority-list{display:flex;flex-direction:column;gap:10px;}
.priority-item{
  display:flex;
  align-items:center;
  gap:14px;
  background:var(--card);
  border:1px solid var(--paper-line);
  padding:10px 14px;
}
.stamp{
  width:52px;height:52px;border-radius:50%;
  border:2px dashed var(--ink);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  transform:rotate(-6deg);
  flex-shrink:0;
  color:var(--ink);
}
.stamp .r{font-family:'Fraunces',serif;font-weight:700;font-size:1.2rem;line-height:1;}
.stamp .t{font-size:0.5rem;letter-spacing:0.5px;text-transform:uppercase;}
.priority-item .pi-main{flex:1;}
.priority-item .pi-main .nm{font-weight:600;}
.priority-item .pi-main .note{font-size:0.76rem;color:var(--ink-soft);margin-top:2px;}
.priority-item .pi-rate{text-align:right;font-family:'IBM Plex Mono',monospace;}
.priority-item .pi-rate .eff{font-weight:600;font-size:1.05rem;color:var(--rust);}
.priority-item .pi-rate .nom{font-size:0.7rem;color:var(--ink-soft);}

/* Waterfall */
.waterfall-input{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap;}
.waterfall-input .field{flex:1;min-width:180px;}
.waterfall-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.waterfall-table th{
  text-align:left;font-size:0.68rem;text-transform:uppercase;color:var(--ink-soft);
  border-bottom:1px solid var(--ink);padding:6px 8px;letter-spacing:0.4px;
}
.waterfall-table td{padding:8px;border-bottom:1px solid var(--paper-line);font-family:'IBM Plex Mono',monospace;}
.waterfall-table td.name{font-family:'IBM Plex Sans',sans-serif;font-weight:500;}
.waterfall-summary{
  margin-top:12px;padding:12px 14px;background:var(--green-soft);border:1px solid var(--green);
  font-size:0.9rem;
}
.waterfall-summary b{color:var(--green);}
.goal-explain{
  font-size:0.8rem;color:var(--ink-soft);line-height:1.5;
  background:var(--paper);border-left:3px solid var(--gold);padding:9px 12px;margin-bottom:14px;
}
.history-table{width:100%;border-collapse:collapse;font-size:0.85rem;}
.history-table th{text-align:left;font-size:0.68rem;text-transform:uppercase;color:var(--ink-soft);border-bottom:1px solid var(--ink);padding:6px 8px;letter-spacing:0.4px;}
.history-table td{padding:8px;border-bottom:1px solid var(--paper-line);font-family:'IBM Plex Mono',monospace;}
.history-table td.delta-pos{color:var(--green);}
.history-table td.delta-neg{color:var(--rust);}
.closed-badge{background:var(--green-soft);color:var(--green);font-size:0.65rem;padding:2px 7px;border-radius:10px;font-weight:600;margin-left:6px;}

/* Simulator */
.sim-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:18px;}
@media(max-width:760px){.sim-grid{grid-template-columns:1fr 1fr;}}
.sim-result{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:640px){.sim-result{grid-template-columns:1fr;}}
.sim-card{background:var(--card);border:1px solid var(--paper-line);padding:14px 16px;}
.sim-card h3{margin:0 0 10px 0;font-family:'Fraunces',serif;font-size:0.95rem;}
.sim-card .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--paper-line);font-size:0.85rem;}
.sim-card .kv .k{color:var(--ink-soft);}
.sim-card .kv .v{font-family:'IBM Plex Mono',monospace;font-weight:600;}
.sim-card.after{border-left:4px solid var(--green);}
.bar-compare{margin-top:14px;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.bar-row .lbl{width:70px;font-size:0.72rem;color:var(--ink-soft);}
.bar-track{flex:1;background:var(--paper-line);height:16px;position:relative;}
.bar-fill{height:100%;background:var(--ink);}
.bar-fill.after{background:var(--green);}
.bar-val{font-size:0.72rem;font-family:'IBM Plex Mono',monospace;width:90px;text-align:right;}

.empty{padding:24px;text-align:center;color:var(--ink-soft);font-size:0.9rem;border:1px dashed var(--paper-line);}
.settings-strip{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:0.82rem;
  background:var(--card);border:1px solid var(--paper-line);padding:10px 14px;margin-bottom:20px;
}
.settings-strip label{display:flex;align-items:center;gap:6px;}
.settings-strip select{padding:4px 6px;border:1px solid var(--paper-line);border-radius:var(--radius);}
footer{text-align:center;font-size:0.72rem;color:var(--ink-soft);margin-top:40px;}
</style>
</head>
<body>
<div class="wrap" id="app">Loading…</div>

<script>
// ---------- State ----------
let loans = [];
let settings = { claimTax: true, taxSlab: 30 };
let editingLoanId = null; // null | 'new' | loan id
let simState = { loanId: null, lumpsum: '', mode: 'tenure', result: null };
let waterfallState = { surplus: '', goal: 'emi', result: null };
let snapshots = [];
let lastSavedAt = null;
let storageReady = false;

const LOAN_TYPES = [
  ['home','Home Loan'],['car','Car Loan'],['personal','Personal Loan'],
  ['education','Education Loan'],['gold','Gold Loan'],['creditcard','Credit Card'],['other','Other']
];

function seedLoans(){
  return [
    {id:'l1', name:'Home Loan — SBI', type:'home', outstanding:3200000, rate:8.4, tenure:180, emi:31324, rateType:'floating', purpose:'personal', sanctionedAfter2026:false, chargeOverride:null, taxBenefit:'home'},
    {id:'l2', name:'Car Loan — HDFC', type:'car', outstanding:450000, rate:9.2, tenure:24, emi:20500, rateType:'fixed', purpose:'personal', sanctionedAfter2026:false, chargeOverride:null, taxBenefit:'none'},
    {id:'l3', name:'Personal Loan', type:'personal', outstanding:200000, rate:14, tenure:18, emi:12383, rateType:'fixed', purpose:'personal', sanctionedAfter2026:false, chargeOverride:null, taxBenefit:'none', lockInMonths:10, lockInBarred:true, lockInChargePct:4, flatFee:0},
    {id:'l4', name:'Credit Card Outstanding', type:'creditcard', outstanding:80000, rate:36, tenure:18, emi:5817, rateType:'floating', purpose:'personal', sanctionedAfter2026:false, chargeOverride:null, taxBenefit:'none'}
  ];
}

// ---------- Persistence ----------
async function loadState(){
  try{
    const r = await window.storage.get('loan-portfolio');
    loans = r ? JSON.parse(r.value) : seedLoans();
  }catch(e){ loans = seedLoans(); }
  try{
    const r2 = await window.storage.get('app-settings');
    settings = r2 ? JSON.parse(r2.value) : settings;
  }catch(e){ /* keep defaults */ }
  try{
    const r3 = await window.storage.get('portfolio-snapshots');
    snapshots = r3 ? JSON.parse(r3.value) : [];
  }catch(e){ snapshots = []; }
  storageReady = true;
  render();
}
async function saveLoans(){
  try{
    const res = await window.storage.set('loan-portfolio', JSON.stringify(loans));
    if(res) lastSavedAt = new Date();
  }catch(e){ console.error('save loans failed', e); }
}
async function saveSettings(){
  try{ await window.storage.set('app-settings', JSON.stringify(settings)); }catch(e){ console.error('save settings failed', e); }
}

// ---------- Finance math ----------
function emiCalc(P, annualRate, n){
  const r = annualRate/12/100;
  if(n<=0) return 0;
  if(r===0) return P/n;
  const f = Math.pow(1+r, n);
  return P*r*f/(f-1);
}
function totalInterest(P, emi, n){ return Math.max(0, emi*n - P); }

function effectiveRate(loan){
  if(!settings.claimTax || loan.taxBenefit==='none' || loan.type==='creditcard') return loan.rate;
  const annualInterestApprox = loan.outstanding * loan.rate/100;
  if(loan.taxBenefit==='home'){
    if(annualInterestApprox<=0) return loan.rate;
    const capped = Math.min(annualInterestApprox, 200000);
    const shieldFraction = (capped/annualInterestApprox) * (settings.taxSlab/100);
    return loan.rate*(1-shieldFraction);
  }
  if(loan.taxBenefit==='education'){
    return loan.rate*(1-settings.taxSlab/100);
  }
  return loan.rate;
}

function chargeInfo(loan){
  if(loan.type==='creditcard') return {pct:0, note:'No foreclosure concept — this is revolving balance. Paying it down is always highest priority.', zero:true};
  if(loan.rateType==='floating' && loan.purpose==='personal') return {pct:0, note:'RBI rules bar prepayment/foreclosure charges on floating-rate loans to individuals for non-business use.', zero:true};
  if(loan.rateType==='floating' && loan.purpose==='business'){
    if(loan.sanctionedAfter2026) return {pct:0, note:'RBI (Pre-payment Charges on Loans) Directions, 2025 remove charges on MSE floating loans sanctioned/renewed on/after 1 Jan 2026.', zero:true};
    const pct = loan.chargeOverride!=null ? loan.chargeOverride : 2;
    return {pct, note:'Pre-2026 business floating loan — charges may still apply. Confirm in your sanction letter/KFS.', zero:false};
  }
  if(loan.rateType==='fixed'){
    const pct = loan.chargeOverride!=null ? loan.chargeOverride : 3;
    return {pct, note:'Fixed-rate loans can still carry a prepayment charge — confirm the exact % with your lender.', zero:false};
  }
  return {pct:0, note:'', zero:true};
}

// Layers a lock-in period on top of the base charge rules: some loans (personal loans especially)
// either forbid any part-payment for the first N months, or allow it but at a steeper charge than
// what applies once the lock-in ends.
function effectiveChargeInfo(loan){
  const lockIn = loan.lockInMonths||0;
  if(lockIn>0){
    if(loan.lockInBarred){
      return {pct:null, barred:true, zero:false, lockedMonths:lockIn,
        note:`Prepayment isn't permitted for another ${lockIn} month${lockIn===1?'':'s'} (lock-in clause).`};
    }
    const pct = loan.lockInChargePct!=null ? loan.lockInChargePct : 4;
    return {pct, barred:false, zero:pct===0, lockedMonths:lockIn,
      note:`Still in lock-in — ${lockIn} month${lockIn===1?'':'s'} left. A steeper ${pct}% charge applies until then.`};
  }
  return {...chargeInfo(loan), barred:false, lockedMonths:0};
}

// Simulates the loan month-by-month at a fixed EMI and rate, rather than trusting a closed-form
// that assumes principal/rate/tenure/EMI are perfectly consistent. Real bank EMIs are rounded,
// sometimes bundle insurance, or the loan has seen a rate reset — this stays accurate regardless.
function simulateForward(P, annualRate, emi, capMonths){
  capMonths = capMonths || 1200; // 100-year safety cap
  const r = annualRate/12/100;
  if(P<=0) return {months:0, interestPaid:0, neverPaysOff:false};
  if(emi<=0) return {months:Infinity, interestPaid:Infinity, neverPaysOff:true};
  let balance = P, months = 0, interestPaid = 0;
  while(balance>0.5 && months<capMonths){
    const interest = balance*r;
    const principal = emi - interest;
    if(principal<=0) return {months:Infinity, interestPaid:Infinity, neverPaysOff:true};
    if(principal>=balance){
      const frac = balance/principal; // fraction of this final EMI actually needed
      interestPaid += interest*frac;
      months += frac;
      balance = 0;
      break;
    }
    interestPaid += interest;
    balance -= principal;
    months++;
  }
  return {months, interestPaid, neverPaysOff: balance>0.5};
}
function loanSchedule(loan){ return simulateForward(loan.outstanding, loan.rate, loan.emi); }

function emiConsistency(loan){
  const sched = loanSchedule(loan);
  if(sched.neverPaysOff) return {ok:false, neverPaysOff:true};
  if(loan.tenure<=0) return {ok:true};
  const diffPct = Math.abs(loan.tenure-sched.months)/Math.max(1,sched.months)*100;
  return {ok: diffPct<12, actualMonths: sched.months, diffPct};
}

function fmt(n){
  if(!isFinite(n)) return '∞';
  n = Math.round(n);
  return '₹' + n.toLocaleString('en-IN');
}
function pct(n){ return isFinite(n) ? n.toFixed(2)+'%' : '—'; }

// ---------- Derived / summary ----------
function summaryTotals(){
  let outstanding=0, emiTotal=0, interestRemaining=0, weightedRateNum=0;
  loans.forEach(l=>{
    outstanding += l.outstanding;
    emiTotal += l.emi;
    const sched = loanSchedule(l);
    interestRemaining += isFinite(sched.interestPaid) ? sched.interestPaid : 0;
    weightedRateNum += l.outstanding*l.rate;
  });
  const wRate = outstanding>0 ? weightedRateNum/outstanding : 0;
  return {outstanding, emiTotal, interestRemaining, wRate};
}

function rankedLoans(){
  return [...loans].sort((a,b)=>{
    if(a.type==='creditcard' && b.type!=='creditcard') return -1;
    if(b.type==='creditcard' && a.type!=='creditcard') return 1;
    return effectiveRate(b) - effectiveRate(a);
  });
}

// ---------- Part-payment simulation ----------
function simulatePartPayment(loan, lumpsum, mode){
  const P = loan.outstanding;
  const emi = loan.emi;
  const base = loanSchedule(loan);
  const oldInterest = base.interestPaid;
  const oldTenure = base.months;
  const newP = Math.max(0, P - lumpsum);
  if(mode==='tenure'){
    const newSched = simulateForward(newP, loan.rate, emi);
    return {
      mode:'tenure', oldEMI:emi, newEMI:emi, oldTenure, newTenure:newSched.months,
      oldInterest, newInterest:newSched.interestPaid,
      interestSaved: oldInterest-newSched.interestPaid, tenureSavedMonths: oldTenure-newSched.months
    };
  } else {
    const n = isFinite(oldTenure) ? oldTenure : loan.tenure;
    const newEMI = emiCalc(newP, loan.rate, n);
    const newSched = simulateForward(newP, loan.rate, newEMI);
    return {
      mode:'emi', oldEMI:emi, newEMI, oldTenure, newTenure:newSched.months,
      oldInterest, newInterest:newSched.interestPaid,
      interestSaved: oldInterest-newSched.interestPaid, emiSaved: emi-newEMI
    };
  }
}

// ---------- Smart lump-sum optimizer ----------
// Goal A: cut monthly EMI the most. For a fixed remaining tenure n, EMI(x) = (P-x)*k where
// k = r(1+r)^n/((1+r)^n-1) is CONSTANT (doesn't depend on how much you've already prepaid).
// So EMI-reduction per rupee prepaid is a flat, exact number per loan (empirically k = EMI/P) —
// no need to approximate. Adjust for the prepayment charge, which inflates the cash you must
// spend to free up that rupee of principal.
function emiCutRate(loan){
  const k = loan.outstanding>0 ? loan.emi/loan.outstanding : 0;
  const info = effectiveChargeInfo(loan);
  const netK = info.barred ? -Infinity : k/(1+(info.pct||0)/100);
  return {k, netK, chargePct: info.pct||0, barred: info.barred};
}

function allocateForEmiCut(surplus){
  const withRate = loans.map(l=>({loan:l, ...emiCutRate(l)}));
  withRate.sort((a,b)=>b.netK-a.netK);
  let remaining = surplus;
  let totalEmiCut = 0;
  const rows = withRate.map(({loan:l, k, netK, chargePct, barred})=>{
    if(barred){
      return {loan:l, principalAlloc:0, cashSpent:0, emiCut:0, closed:false, interestSaved:0, barred:true};
    }
    const cashToClose = l.outstanding*(1+chargePct/100);
    let principalAlloc, cashSpent, closed;
    if(remaining >= cashToClose){
      principalAlloc = l.outstanding; cashSpent = cashToClose; closed = true;
    } else {
      cashSpent = remaining;
      principalAlloc = cashSpent/(1+chargePct/100);
      closed = false;
    }
    remaining -= cashSpent;
    const emiCut = k*principalAlloc;
    totalEmiCut += emiCut;
    const interestSaved = principalAlloc>0 ? simulatePartPayment(l, principalAlloc, 'emi').interestSaved : 0;
    return {loan:l, principalAlloc, cashSpent, emiCut, closed, interestSaved, barred:false};
  });
  return {rows, totalEmiCut, leftover:Math.max(0,remaining), goal:'emi'};
}

// Goal B: minimize total lifetime interest. Marginal rupee value differs per loan depending on
// BOTH rate and remaining tenure (a low-rate loan with a long runway can beat a high-rate loan
// that's almost finished, because that rupee would otherwise keep compounding for longer).
// We compute the true marginal (calculus-derived, verified against finite differences) at each
// step and pour the surplus, rupee by rupee, into whichever loan currently has the highest net
// marginal benefit — a greedy "water-filling" allocation.
function interestSavedAt(loan, x){
  const newP = Math.max(0, loan.outstanding-x);
  const before = loanSchedule(loan).interestPaid;
  const after = simulateForward(newP, loan.rate, loan.emi).interestPaid;
  if(!isFinite(before) || !isFinite(after)) return 0;
  return before - after;
}
function marginalInterestValue(loan, x, taxAdjFactor, chargePct){
  const eps = Math.max(1, loan.outstanding*0.001);
  const capEps = Math.min(eps, loan.outstanding-x);
  if(capEps<=0) return -Infinity;
  const base = interestSavedAt(loan, x);
  const bump = interestSavedAt(loan, x+capEps);
  const grossPerRupee = (bump-base)/capEps;
  return grossPerRupee*taxAdjFactor - chargePct/100;
}
function allocateForInterest(surplus){
  const meta = loans.map(l=>{
    const info = effectiveChargeInfo(l);
    const taxAdjFactor = (settings.claimTax && l.rate>0) ? effectiveRate(l)/l.rate : 1;
    return {loan:l, chargePct:info.pct||0, taxAdjFactor, barred:info.barred};
  });
  const alloc = {}; loans.forEach(l=>alloc[l.id]=0);
  const numSteps = 300;
  const chunk = surplus/numSteps;
  let remaining = surplus;
  for(let step=0; step<numSteps && remaining>0.5; step++){
    let best=null, bestVal=-Infinity;
    for(const m of meta){
      if(m.barred) continue;
      if(alloc[m.loan.id] >= m.loan.outstanding-0.5) continue;
      const v = marginalInterestValue(m.loan, alloc[m.loan.id], m.taxAdjFactor, m.chargePct);
      if(v>bestVal){ bestVal=v; best=m; }
    }
    if(!best) break;
    const amt = Math.min(chunk, best.loan.outstanding-alloc[best.loan.id], remaining);
    alloc[best.loan.id] += amt;
    remaining -= amt;
  }
  let totalInterestSaved = 0;
  const rows = loans.map(l=>{
    const x = alloc[l.id];
    const interestSaved = x>0.5 ? interestSavedAt(l, x) : 0;
    totalInterestSaved += interestSaved;
    return {loan:l, principalAlloc:x, closed: x>=l.outstanding-0.5, interestSaved};
  }).sort((a,b)=>b.principalAlloc-a.principalAlloc);
  return {rows, totalInterestSaved, leftover:Math.max(0,remaining), goal:'interest'};
}

function runOptimizer(surplus, goal){
  if(surplus<=0) return null;
  return goal==='emi' ? allocateForEmiCut(surplus) : allocateForInterest(surplus);
}

// ---------- Minimum worthwhile lump sum ----------
// Small prepayments can be swallowed by a flat processing fee or a lock-in-period charge.
// This finds the smallest amount that (a) clearly nets positive after all charges (net benefit
// at least 3x the charge paid — not just barely breaking even) and (b) saves at least 3 months
// of tenure, which is the point most people would actually notice and call "worth doing."
function minWorthwhileLumpsum(loan){
  const eff = effectiveChargeInfo(loan);
  if(eff.barred) return {barred:true, lockedMonths:eff.lockedMonths};
  const chargePct = eff.pct||0;
  const flatFee = loan.flatFee||0;
  const base = loanSchedule(loan);
  if(!isFinite(base.months) || base.months<3){
    return {tooShort:true, monthsLeft: isFinite(base.months)?base.months:null};
  }
  const targetMonths = Math.min(3, base.months*0.5);
  let lo=0, hi=loan.outstanding, found=null;
  for(let i=0;i<40;i++){
    const mid=(lo+hi)/2;
    const sim = simulatePartPayment(loan, mid, 'tenure');
    const chargeCost = flatFee + (chargePct/100)*mid;
    const netBenefit = sim.interestSaved - chargeCost;
    const meetsBar = sim.tenureSavedMonths>=targetMonths && netBenefit>=3*Math.max(flatFee,1);
    if(meetsBar){ found=mid; hi=mid; } else { lo=mid; }
  }
  if(found==null) return {impossible:true};
  const sim = simulatePartPayment(loan, found, 'tenure');
  const chargeCost = flatFee + (chargePct/100)*found;
  return {amount:found, tenureSavedMonths:sim.tenureSavedMonths, interestSaved:sim.interestSaved, chargeCost, lockedMonths:0};
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
async function saveSnapshot(){
  const s = summaryTotals();
  const entry = {date: todayStr(), outstanding: s.outstanding, emiTotal: s.emiTotal, interestRemaining: s.interestRemaining};
  const existingIdx = snapshots.findIndex(x=>x.date===entry.date);
  if(existingIdx>=0) snapshots[existingIdx]=entry; else snapshots.push(entry);
  snapshots.sort((a,b)=>a.date<b.date?-1:1);
  try{ await window.storage.set('portfolio-snapshots', JSON.stringify(snapshots)); }catch(e){ console.error('snapshot save failed', e); }
  render();
}

          <select id="f_taxBenefit">
            <option value="none" ${l.taxBenefit==='none'?'selected':''}>None</option>
            <option value="${l.type==='home'?'home':'education'}" ${l.taxBenefit!=='none'?'selected':''}>${l.type==='home'?'Sec 24(b) home loan interest':'Sec 80E education loan interest'}</option>
          </select>
        </div>` : ''}
      </div>
      <div class="form-actions">
        <button class="btn" data-action="save-loan" data-id="${isNew?'':l.id}">Save</button>
        <button class="btn secondary" data-action="cancel-edit">Cancel</button>
      </div>
    </div>
  `;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;'); }

// ---------- Event delegation ----------
document.getElementById('app').addEventListener('click', async (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;

  if(action==='new-loan'){ editingLoanId='new'; render(); }
  else if(action==='edit-loan'){ editingLoanId=btn.dataset.id; render(); }
  else if(action==='cancel-edit'){ editingLoanId=null; render(); }
  else if(action==='delete-loan'){
    loans = loans.filter(l=>l.id!==btn.dataset.id);
    await saveLoans();
    render();
  }
  else if(action==='save-loan'){
    const name = document.getElementById('f_name').value.trim() || 'Untitled loan';
    const type = document.getElementById('f_type').value;
    const outstanding = parseFloat(document.getElementById('f_outstanding').value)||0;
    const rate = parseFloat(document.getElementById('f_rate').value)||0;
    const tenure = parseFloat(document.getElementById('f_tenure').value)||0;
    const emi = parseFloat(document.getElementById('f_emi').value)||0;
    const isCC = type==='creditcard';
    const rateType = isCC ? 'floating' : document.getElementById('f_rateType').value;
    const purpose = isCC ? 'personal' : document.getElementById('f_purpose').value;
    const sanctionedAfter2026 = isCC ? false : document.getElementById('f_sanctioned').checked;
    const chargeRaw = isCC ? '' : document.getElementById('f_charge').value;
    const chargeOverride = chargeRaw===''? null : parseFloat(chargeRaw);
    const flatFee = isCC ? 0 : (parseFloat(document.getElementById('f_flatFee').value)||0);
    const lockInMonths = isCC ? 0 : (parseFloat(document.getElementById('f_lockInMonths').value)||0);
    const lockInBarred = isCC ? false : document.getElementById('f_lockInBarred').checked;
    const lockInChargePct = isCC ? 0 : (parseFloat(document.getElementById('f_lockInChargePct').value)||0);
    const taxBenefitEl = document.getElementById('f_taxBenefit');
    const taxBenefit = taxBenefitEl ? taxBenefitEl.value : 'none';

    const id = btn.dataset.id || ('l'+Date.now());
    const newLoan = {id,name,type,outstanding,rate,tenure,emi,rateType,purpose,sanctionedAfter2026,chargeOverride,taxBenefit,flatFee,lockInMonths,lockInBarred,lockInChargePct};
    const idx = loans.findIndex(l=>l.id===id);
    if(idx>=0) loans[idx]=newLoan; else loans.push(newLoan);
    editingLoanId=null;
    await saveLoans();
    render();
  }
  else if(action==='run-waterfall'){
    const surplus = parseFloat(document.getElementById('surplusInput').value)||0;
    const goal = document.getElementById('goalSelect').value;
    waterfallState.surplus = surplus;
    waterfallState.goal = goal;
    waterfallState.result = runOptimizer(surplus, goal);
    render();
  }
  else if(action==='save-snapshot'){
    await saveSnapshot();
  }
  else if(action==='run-sim'){
    const loanId = document.getElementById('simLoan').value;
    const lumpsum = parseFloat(document.getElementById('simLumpsum').value)||0;
    const mode = document.getElementById('simMode').value;
    simState.loanId = loanId; simState.lumpsum = lumpsum; simState.mode = mode;
    const loan = loans.find(l=>l.id===loanId);
    simState.result = loan ? simulatePartPayment(loan, lumpsum, mode) : null;
    render();
  }
});

document.getElementById('app').addEventListener('change', async (e)=>{
  if(e.target.id==='claimTax'){ settings.claimTax = e.target.checked; await saveSettings(); render(); }
  if(e.target.id==='taxSlab'){ settings.taxSlab = parseFloat(e.target.value); await saveSettings(); render(); }
});

loadState();
</script>
</body>
</html>
